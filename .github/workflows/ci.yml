name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 9 * * *"

# Least privilege: the default GITHUB_TOKEN is read-only. Jobs that need more raise it explicitly.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2
        with:
          egress-policy: audit   # S9: observe egress on the highest-value (PR-triggered) runner
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Install package
        run: |
          python scripts/check_dependency_locks.py
          python -m pip install --require-hashes --only-binary=:all: --force-reinstall -r .github/dev-requirements.txt
          python -m pip install --no-deps --no-build-isolation -e .
      - name: Lint (must stay clean)
        run: ruff check src/ scripts/ tests/ examples/ lab/
      - name: Tests
        run: python -m pytest tests/ -q
      - name: Reproducibility smoke
        run: bash lab/reproduce.sh 1
      - name: Packet workflow smoke
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          export KRY_DATA_DIR="$tmp/kry_data"
          python3 scripts/kry_doctor.py
          python3 scripts/kry_savings_report.py examples/sample_usage_log.jsonl
          python3 scripts/kry_savings_report.py examples/sample_usage_log.jsonl --mint --attest "$tmp/att.json"
          python3 scripts/kry_verify.py "$tmp/att.json"
          python3 scripts/kry_verified_artifact.py examples/sample_usage_log.jsonl \
            --attestation "$tmp/att.json" \
            --mint-log "$KRY_DATA_DIR/kry_mint_log.jsonl" \
            --bundle-dir "$tmp/packet"
          python3 scripts/kry_verified_artifact.py --verify-artifact "$tmp/packet/artifact.json"
          python3 scripts/kry_finops_report.py "$tmp/packet/artifact.json"
          python3 scripts/kry_doctor.py --artifact "$tmp/packet/artifact.json"

  # The ubuntu jobs cannot see Windows-only defects (cp1252 console, locale file reads,
  # POSIX-rooted paths, O_EXCL PermissionError races); every one fixed in #57 passed them.
  test-versions:
    # The classifiers claim 3.11-3.14; the required `test` job above runs 3.11 only. A separate job,
    # so the required check keeps its name.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: |
          python scripts/check_dependency_locks.py
          python -m pip install --require-hashes --only-binary=:all: --force-reinstall -r .github/dev-requirements.txt
          python -m pip install --no-deps --no-build-isolation -e .
      - name: Tests
        run: python -m pytest tests/ -q

  test-windows:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Install package
        shell: bash
        run: |
          python scripts/check_dependency_locks.py
          python -m pip install --require-hashes --only-binary=:all: --force-reinstall -r .github/dev-requirements.txt
          python -m pip install --no-deps --no-build-isolation -e .
      - name: Tests
        run: python -m pytest tests/ -q

  litellm-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Install package and integration dependency
        run: |
          python scripts/check_dependency_locks.py
          python -m pip install --require-hashes --only-binary=:all: --force-reinstall -r .github/litellm-requirements.txt
          python -m pip install --no-deps --no-build-isolation -e .
          python -m pip check
      - name: Require LiteLLM and exercise its real callback dispatch with mock responses
        run: |
          python -c "import litellm"
          python -m pytest tests/test_litellm_integration.py tests/test_litellm_anthropic_integration.py tests/test_litellm_observation_integration.py -q

  optional-crypto:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # The pinned wrapper rejects this before its fallback clone; missing native code must fail.
      PYOQS_VERSION: disabled-by-kry-ci
      PYTHONDONTWRITEBYTECODE: "1"
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Set temporary crypto paths
        run: |
          printf '%s\n' "OQS_INSTALL_PATH=$RUNNER_TEMP/kry-oqs" "KRY_DATA_DIR=$RUNNER_TEMP/kry-crypto-data" >> "$GITHUB_ENV"
      - name: Install hash-locked optional crypto tools
        run: |
          python scripts/check_dependency_locks.py
          python -m pip install --require-hashes --only-binary=:all: --force-reinstall -r .github/crypto-requirements.txt
          python -m pip install --no-deps --no-build-isolation -e .
          python -m pip check
      - name: Verify and build the pinned native signature library
        run: |
          set -euo pipefail
          curl --fail --location --proto '=https' --tlsv1.2 \
            https://codeload.github.com/open-quantum-safe/liboqs/tar.gz/refs/tags/0.16.0 \
            --output "$RUNNER_TEMP/liboqs.tar.gz"
          printf '%s  %s\n' '162d5b510518ee5f285f82fa1f16402a885176e818bf1b1a4c3c91c9a2f01eae' "$RUNNER_TEMP/liboqs.tar.gz" | sha256sum --check --strict
          mkdir "$RUNNER_TEMP/liboqs-source"
          tar -xzf "$RUNNER_TEMP/liboqs.tar.gz" -C "$RUNNER_TEMP/liboqs-source" --strip-components=1
          cmake -S "$RUNNER_TEMP/liboqs-source" -B "$RUNNER_TEMP/liboqs-build" \
            -DCMAKE_INSTALL_PREFIX="$OQS_INSTALL_PATH" -DCMAKE_INSTALL_LIBDIR=lib \
            -DBUILD_SHARED_LIBS=ON -DOQS_BUILD_ONLY_LIB=ON -DOQS_USE_OPENSSL=OFF \
            '-DOQS_MINIMAL_BUILD=SIG_ml_dsa_44;SIG_ml_dsa_65;SIG_ml_dsa_87' \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build "$RUNNER_TEMP/liboqs-build" --parallel 2
          cmake --install "$RUNNER_TEMP/liboqs-build"
      - name: Exercise real ML-DSA and optional attestation fixtures with no skips
        run: |
          python scripts/kry_optional_crypto_check.py \
            --native-library "$OQS_INSTALL_PATH/lib/liboqs.so" \
            --junit "$RUNNER_TEMP/optional-crypto.xml"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: optional-crypto-tests
          path: ${{ runner.temp }}/optional-crypto.xml

  release-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2
        with:
          egress-policy: audit   # S9: observe egress on the highest-value (PR-triggered) runner
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Run release verifier
        run: python3 scripts/kry_release_verify.py --json-out release-verify.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: release-verify
          path: release-verify.json

  full-reproducibility:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2
        with:
          egress-policy: audit   # S9: observe egress on the highest-value (PR-triggered) runner
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Run full release verifier
        run: python3 scripts/kry_release_verify.py --full --json-out release-verify-full.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: release-verify-full
          path: release-verify-full.json

  conformance-vectors:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: JS verifier vs the conformance corpus (SPEC v1.3)
        run: node verifiers/js/cli.mjs --vectors vectors
      - name: Corpus drift guard — regenerate from the reference and diff
        run: |
          PYTHONPATH=src python3 vectors/generate.py
          git diff --exit-code vectors/
      - name: Browser demo wiring — the page's imports and demo vectors still resolve
        run: node verifiers/web/check_demos.mjs
      # A FRESH seed each run, deliberately: diff_fuzz's fixed seed 1234 makes a single run
      # reproducible but explores the same stream every time. The 2026-08-01 envelope-completeness
      # divergences sat undetected because no run ever varied the mutation stream. N is small enough
      # for per-push CI; the 10^6 SC2 bar stays a manual, sealed run (docs/evidence/spec_v1_sc2_run.md).
      - name: Differential fuzz — Python reference vs JS verifier (fresh seed)
        run: PYTHONPATH=src KRY_FUZZ_SEED=${{ github.run_id }} python3 verifiers/diff_fuzz.py 20000
