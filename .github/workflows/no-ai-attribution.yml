name: Attribution Guard

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read   # least-privilege: this guard only reads the tree

jobs:
  attribution-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0   # the commit checks below need the full history of the range
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Check tracked text artifacts
        run: python3 scripts/check_attribution.py
      - name: Check commit messages and identities (pull request)
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 scripts/check_attribution.py --commits "$BASE_SHA..$HEAD_SHA"
      - name: Check commit messages and identities (push)
        if: github.event_name == 'push'
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          # always check the pushed tip itself ("<sha>^!" = that one commit)
          python3 scripts/check_attribution.py --commits "$AFTER_SHA^!"
          if git cat-file -e "$BEFORE_SHA^{commit}" 2>/dev/null; then
            python3 scripts/check_attribution.py --commits "$BEFORE_SHA..$AFTER_SHA"
          else
            # new branch or force-push: every commit not already on the default branch
            python3 scripts/check_attribution.py --commits "origin/$DEFAULT_BRANCH..$AFTER_SHA"
          fi
