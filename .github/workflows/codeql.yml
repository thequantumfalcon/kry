name: CodeQL

# Static analysis (SAST) for the Python sources. Runs on PRs, pushes to main, and weekly.
on:
  push:
    branches: ["main"]
  pull_request:
  schedule:
    - cron: "23 9 * * 1"  # weekly, Monday

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (python)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # CodeQL is free on public repos; on private it needs GitHub Advanced Security.
    # Skip cleanly until this repo is public so CI never fails on it.
    if: ${{ !github.event.repository.private }}
    permissions:
      contents: read
      security-events: write  # upload CodeQL findings to the Security tab
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          languages: python
          queries: security-extended
      - uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          category: "/language:python"
