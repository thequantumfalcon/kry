name: Scorecard

# OpenSSF Scorecard — measures the repo's security posture (branch protection, pinned deps,
# token permissions, etc.) and publishes a public score. A strong due-diligence signal.
on:
  workflow_dispatch:
  branch_protection_rule:
  schedule:
    - cron: "41 9 * * 2"  # weekly, Tuesday
  push:
    branches: ["main"]

permissions: read-all

jobs:
  analysis:
    name: OpenSSF Scorecard
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Scorecard publishing requires a public repo. Skip cleanly until this repo is public.
    if: ${{ !github.event.repository.private }}
    permissions:
      contents: read
      security-events: write  # upload SARIF to the Security tab
      id-token: write         # publish results to the OpenSSF API (no secrets)
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: scorecard-results
          path: results.sarif
          retention-days: 5
      - uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: results.sarif
